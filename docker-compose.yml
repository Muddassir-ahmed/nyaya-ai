services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyaya-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: nyaya
      POSTGRES_USER: nyaya_user
      POSTGRES_PASSWORD: nyaya_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: